<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Shelf check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<!-- icon sprite (no external requests) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-empty" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.6"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor" stroke="currentColor" stroke-width="2.6"/></symbol>
    <symbol id="i-low" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-wrong" viewBox="0 0 24 24"><path d="M12 3.2 22 20.5H2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M12 9.5v5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="17.4" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m7.6 12.4 3.1 3.1 5.8-6.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="m3.4 6 1.2 1.2L6.8 4.8M3.4 12l1.2 1.2 2.2-2.4M3.4 18l1.2 1.2 2.2-2.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 12h18M10 4v16" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5V9h15v8H17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><rect x="7" y="14" width="10" height="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5.5-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M8.5 16v-4M13 16V8M17.5 16v-6.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1 id="app-title">Shelf check</h1>
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-act="lang" data-v="en" aria-pressed="true">EN</button>
          <button type="button" data-act="lang" data-v="pt" aria-pressed="false">PT</button>
        </div>
        <button type="button" class="icon-btn" id="theme-btn" data-act="theme" aria-label="Switch theme"><svg class="ic"><use href="#i-moon"/></svg></button>
        <button type="button" class="icon-btn" id="print-btn" data-act="print" aria-label="Print task list"><svg class="ic"><use href="#i-print"/></svg></button>
      </div>
    </div>
    <p id="subtitle" class="sub"></p>
    <div class="counters" id="counters" role="group"></div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Views">
  <div class="wrap tabs-in">
    <a class="tab" href="#/tasks" data-tab="tasks"><svg class="ic"><use href="#i-list"/></svg><span data-i18n="tab_tasks">Do now</span></a>
    <a class="tab" href="#/gondola" data-tab="gondola"><svg class="ic"><use href="#i-grid"/></svg><span data-i18n="tab_gondola">Gondolas</span></a>
    <a class="tab" href="#/products" data-tab="products"><svg class="ic"><use href="#i-box"/></svg><span data-i18n="tab_products">Products</span></a>
    <a class="tab" href="#/insights" data-tab="insights"><svg class="ic"><use href="#i-chart"/></svg><span data-i18n="tab_insights">Insights</span></a>
  </div>
</nav>

<div class="filters" id="filters">
  <div class="wrap filters-in">
    <label class="field" id="cam-field">
      <span class="sr" data-i18n="f_camera">Camera</span>
      <select id="cam-select"></select>
    </label>
    <label class="field grow">
      <span class="sr" data-i18n="f_search">Search</span>
      <svg class="ic field-ic"><use href="#i-search"/></svg>
      <input id="search" type="search" autocomplete="off" placeholder="Search product or area">
    </label>
    <button type="button" class="chip" id="clear-filters" data-act="clear" hidden></button>
  </div>
</div>

<main id="main" class="wrap" tabindex="-1">
  <section id="view-tasks" hidden></section>
  <section id="view-gondola" hidden></section>
  <section id="view-products" hidden></section>
  <section id="view-insights" hidden></section>
</main>

<footer class="wrap foot" id="foot"></footer>
<div id="print-sheet" aria-hidden="true"></div>
<noscript><p class="wrap">This page needs JavaScript (no network needed).</p></noscript>

<script src="data.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
